<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Smart AI Chat — a simple AI assistant in your browser.">
    <title>Smart AI Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SMART AI</p>
          <h1>Smart AI Chat</h1>
        </div>
        <button class="secondary-button" id="newChatButton" type="button">New chat</button>
      </header>

      <section class="chat-card" aria-label="Chat with Smart AI">
        <div class="messages" id="messages" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="orb">✦</div>
            <h2>How can I help?</h2>
            <p>Ask a question or choose a starter prompt.</p>
            <div class="suggestions">
              <button type="button" data-prompt="Explain artificial intelligence in simple terms">Explain AI simply</button>
              <button type="button" data-prompt="Write a short email asking for a deadline extension">Write an email</button>
              <button type="button" data-prompt="Give me a 3-day study plan for databases">Make a study plan</button>
            </div>
          </div>
        </div>

        <form class="composer" id="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea id="messageInput" maxlength="4000" rows="1" placeholder="Message Smart AI..." autocomplete="off"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="Send message">➤</button>
        </form>
        <p class="disclaimer">Smart AI can make mistakes. Check important information.</p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
